services:
  postgres:
    image: postgres:16-alpine
    container_name: search_engine_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: search_engine
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: search_engine_redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  emqx1:
    image: emqx:latest
    container_name: emqx1
    restart: unless-stopped
    environment:
      - EMQX_NODE__NAME=emqx1@localhost
      - EMQX_DASHBOARD__DEFAULT_USERNAME=admin
      - EMQX_DASHBOARD__DEFAULT_PASSWORD=admin
    ports:
      - "1883:1883"      # MQTT TCP Standar (Backend Go & Device IoT)
      - "8883:8883"      # MQTT SSL/TLS (Koneksi Aman)
      - "8083:8083"      # MQTT over WebSocket (Frontend React)
      - "8084:8084"      # MQTT over WSS (Secure WebSocket)
      # Antarmuka Web & REST API
      - "18083:18083"
    volumes:
      - vol-emqx-data:/var/lib/emqx/data
      - vol-emqx-log:/var/lib/emqx/log
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:18083/api/v5/health" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  vol-emqx-data:
  vol-emqx-log:
